name: Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Silent TTS APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK on GitHub (retry transient repository errors)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --max-workers=2 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before retrying transient dependency downloads..."
              sleep $((attempt * 30))
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Prepare APK for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "dist/Silent-TTS-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silent-TTS-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Silent TTS ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
