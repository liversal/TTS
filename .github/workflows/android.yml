name: Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Silent TTS APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK on GitHub
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "dist/Silent-TTS-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silent-TTS-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Silent TTS ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
